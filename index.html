<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sicore - Безопасный мессенджер</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --coffee-dark: #1a1512;
            --coffee-brown: #2b2017;
            --coffee-medium: #3d2e26;
            --coffee-light: #6b5449;
            --cream: #f5f1ed;
            --cream-dark: #d4cfc9;
            --accent: #b8956a;
            --online: #43b581;
            --offline: #747f8d;
            --danger: #ed4245;
            --success: #43b581;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--coffee-dark);
            color: var(--cream);
            height: 100vh;
            overflow: hidden;
        }

        /* ==================== ANIMATIONS ==================== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* ==================== AUTH ==================== */
        #authScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--coffee-dark) 0%, var(--coffee-brown) 100%);
            padding: 20px;
        }

        .auth-container {
            background: rgba(43, 32, 23, 0.95);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(184, 149, 106, 0.2);
            max-width: 400px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo h1 {
            font-size: 36px;
            background: linear-gradient(135deg, var(--cream) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-logo p {
            color: var(--accent);
            font-size: 14px;
        }

        .auth-step {
            display: none;
        }

        .auth-step.active {
            display: block;
            animation: slideInRight 0.4s ease;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--cream-dark);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--coffee-dark);
            border: 2px solid transparent;
            border-radius: 10px;
            color: var(--cream);
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #9d7d54 100%);
            color: var(--coffee-dark);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(184, 149, 106, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .code-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .code-input {
            width: 45px;
            height: 55px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            background: var(--coffee-dark);
            border: 2px solid var(--coffee-medium);
            border-radius: 10px;
            color: var(--cream);
            transition: all 0.3s;
        }

        .code-input:focus {
            border-color: var(--accent);
            outline: none;
            transform: scale(1.05);
        }

        .error-message {
            background: rgba(237, 66, 69, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        /* ==================== APP ==================== */
        #app {
            display: none;
            height: 100vh;
            grid-template-columns: 380px 1fr;
        }

        /* ==================== SIDEBAR ==================== */
        .sidebar {
            background: var(--coffee-brown);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(184, 149, 106, 0.1);
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(184, 149, 106, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 700;
        }

        .search-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(184, 149, 106, 0.1);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: var(--accent);
            transform: scale(1.1);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            position: relative;
        }

        .chat-item:hover {
            background: rgba(184, 149, 106, 0.05);
        }

        .chat-item.active {
            background: var(--coffee-medium);
            border-left-color: var(--accent);
        }

        .chat-item.pinned {
            background: rgba(184, 149, 106, 0.08);
        }

        .chat-item.long-press {
            background: var(--coffee-medium);
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
            position: relative;
            flex-shrink: 0;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid var(--coffee-brown);
        }

        .status-online {
            background: var(--online);
        }

        .status-offline {
            background: var(--offline);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-last-message {
            font-size: 13px;
            color: var(--cream-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .chat-time {
            font-size: 12px;
            color: var(--accent);
        }

        .unread-badge {
            background: var(--accent);
            color: var(--coffee-dark);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
        }

        .mute-icon {
            font-size: 14px;
            color: var(--accent);
        }

        .user-panel {
            padding: 12px 20px;
            border-top: 1px solid rgba(184, 149, 106, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(26, 21, 18, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-panel:hover {
            background: rgba(26, 21, 18, 0.5);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            position: relative;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .user-status {
            font-size: 12px;
            color: var(--accent);
        }

        /* ==================== CHAT AREA ==================== */
        .chat-area {
            display: flex;
            flex-direction: column;
            background: var(--coffee-dark);
        }

        .chat-header {
            padding: 12px 24px;
            border-bottom: 1px solid rgba(184, 149, 106, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--coffee-brown);
            cursor: pointer;
        }

        .chat-header:hover {
            background: rgba(61, 46, 38, 0.8);
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 2px;
        }

        .chat-header-status {
            font-size: 13px;
        }

        .chat-header-status.online {
            color: var(--online);
        }

        .chat-header-status.offline {
            color: var(--offline);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-size: cover;
            background-position: center;
        }

        .message {
            display: flex;
            gap: 8px;
            max-width: 70%;
            animation: fadeIn 0.3s ease;
        }

        .message.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .message-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-bubble {
            background: rgba(43, 32, 23, 0.9);
            padding: 10px 14px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message.own .message-bubble {
            background: rgba(184, 149, 106, 0.9);
            color: var(--coffee-dark);
        }

        .message-text {
            font-size: 15px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .message-image {
            max-width: 300px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .message-image:hover {
            transform: scale(1.02);
        }

        .message-time {
            font-size: 11px;
            color: var(--cream-dark);
            align-self: flex-end;
            padding: 0 4px;
        }

        .message.own .message-time {
            color: rgba(26, 21, 18, 0.6);
        }

        .message-input-container {
            padding: 16px 24px;
            background: var(--coffee-brown);
            border-top: 1px solid rgba(184, 149, 106, 0.1);
        }

        .blocked-message, .bot-message, .restricted-message {
            text-align: center;
            padding: 20px;
            color: var(--accent);
            background: rgba(184, 149, 106, 0.1);
            border-radius: 12px;
            margin: 10px;
        }

        .message-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            background: var(--coffee-dark);
            border-radius: 24px;
            padding: 10px 16px;
        }

        .input-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .attach-btn, .emoji-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 20px;
        }

        .attach-btn:hover, .emoji-btn:hover {
            background: var(--accent);
        }

        .message-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--cream);
            font-size: 15px;
            resize: none;
            max-height: 120px;
            font-family: inherit;
        }

        .message-input:focus {
            outline: none;
        }

        .send-button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 18px;
        }

        .send-button:hover {
            transform: scale(1.1);
        }

        .image-preview {
            display: none;
            padding: 12px;
            background: rgba(184, 149, 106, 0.1);
            border-radius: 12px;
            margin-bottom: 8px;
            position: relative;
        }

        .image-preview.active {
            display: block;
        }

        .image-preview img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
        }

        .remove-preview {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--danger);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .empty-chat h2 {
            font-size: 28px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--cream) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ==================== MODALS ==================== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--coffee-brown);
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(184, 149, 106, 0.2);
            animation: fadeIn 0.3s ease;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(184, 149, 106, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .close-button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(184, 149, 106, 0.1);
            border: none;
            color: var(--cream);
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
        }

        .close-button:hover {
            background: var(--danger);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 24px;
        }

        /* ==================== PROFILE ==================== */
        .profile-header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(180deg, var(--coffee-medium) 0%, transparent 100%);
        }

        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            margin: 0 auto 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .profile-avatar-large:hover {
            transform: scale(1.05);
        }

        .profile-avatar-large img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .profile-lastname {
            font-size: 18px;
            color: var(--cream-dark);
            margin-bottom: 12px;
        }

        .profile-bio {
            font-size: 14px;
            color: var(--accent);
            margin-top: 8px;
        }

        .profile-menu {
            padding: 0 24px;
        }

        .menu-section {
            margin-bottom: 24px;
        }

        .menu-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .menu-item {
            padding: 14px 16px;
            background: var(--coffee-dark);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-item:hover {
            background: var(--coffee-medium);
            transform: translateX(4px);
        }

        .menu-item.danger {
            color: var(--danger);
        }

        .toggle-switch {
            width: 48px;
            height: 26px;
            background: var(--coffee-medium);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-switch.active {
            background: var(--accent);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: var(--cream);
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle-switch.active::after {
            left: 24px;
        }

        /* ==================== EMOJI PICKER ==================== */
        .emoji-picker {
            position: absolute;
            bottom: 80px;
            left: 24px;
            background: var(--coffee-brown);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: none;
            width: 340px;
            max-height: 400px;
            overflow-y: auto;
        }

        .emoji-picker.active {
            display: block;
        }

        .emoji-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(184, 149, 106, 0.1);
            padding-bottom: 8px;
        }

        .emoji-tab {
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: var(--cream-dark);
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .emoji-tab.active {
            background: var(--accent);
            color: var(--coffee-dark);
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
        }

        .emoji-item, .gif-item {
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            text-align: center;
        }

        .emoji-item:hover, .gif-item:hover {
            background: var(--coffee-medium);
            transform: scale(1.2);
        }

        .gif-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .gif-item {
            aspect-ratio: 1;
            background: var(--coffee-dark);
            border-radius: 8px;
            overflow: hidden;
            padding: 0;
        }

        .gif-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ==================== CONTEXT MENU ==================== */
        .context-menu {
            position: fixed;
            background: var(--coffee-brown);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            z-index: 10000;
            display: none;
        }

        .context-menu.active {
            display: block;
        }

        .context-menu-item {
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-size: 14px;
        }

        .context-menu-item:hover {
            background: var(--coffee-medium);
        }

        .context-menu-item.danger {
            color: var(--danger);
        }

        /* ==================== IMAGE VIEWER ==================== */
        .image-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .image-viewer.active {
            display: flex;
        }

        .image-viewer img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .image-viewer-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        /* ==================== AVATAR EDITOR ==================== */
        .avatar-editor {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .avatar-editor.active {
            display: flex;
        }

        .avatar-preview-large {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--accent);
        }

        .avatar-preview-large img {
            width: 100%;

            object-fit: cover;
        }

        .avatar-controls {
            display: flex;
            gap: 12px;
        }

        /* ==================== MOBILE ==================== */
        @media (max-width: 768px) {
            #app {
                grid-template-columns: 1fr;
            }

            .chat-area {

            }

            .chat-area.mobile-active {

                display: none;
            }

            .message {
                max-width: 85%;
            }

            .emoji-picker {
                width: 90%;

            }
        }

        /* ==================== SCROLLBAR ==================== */
        ::-webkit-scrollbar {

        }

        ::-webkit-scrollbar-track {

        ::-webkit-scrollbar-thumb {

        .loading {

            width: 20px;
            height: 20px;

            border-radius: 50%;

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-button {
            display: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(184, 149, 106, 0.1);
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--cream);
        }

        @media (max-width: 768px) {
            .back-button {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }

        select {
            width: 100%;
            padding: 10px;
            background: var(--coffee-dark);
            border: 2px solid var(--coffee-medium);
            border-radius: 8px;
            color: var(--cream);
            font-size: 14px;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <!-- AUTH SCREEN -->
    <div id="authScreen">
        <div class="auth-container">
            <div class="auth-logo">
                <h1>Sicore</h1>
                <p>Безопасный мессенджер</p>
            </div>

            <!-- Email Step -->
            <div class="auth-step active" id="stepEmail">
                <div id="emailError"></div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="emailInput" placeholder="example@gmail.com">
                </div>
                <button class="btn btn-primary" id="sendEmailBtn" onclick="sendEmailCode()">Получить код</button>
            </div>

            <!-- Code Step -->
            <div class="auth-step" id="stepCode">
                <div id="codeError"></div>
                <p style="text-align: center; margin-bottom: 20px; color: var(--cream-dark);">
                    Введите код из email<br>
                    <span style="color: var(--accent);" id="emailDisplay"></span>
                </p>
                <div class="code-inputs">
                    <input type="text" class="code-input" maxlength="1" id="code1">
                    <input type="text" class="code-input" maxlength="1" id="code2">
                    <input type="text" class="code-input" maxlength="1" id="code3">
                    <input type="text" class="code-input" maxlength="1" id="code4">
                    <input type="text" class="code-input" maxlength="1" id="code5">
                    <input type="text" class="code-input" maxlength="1" id="code6">
                </div>
                <button class="btn btn-primary" id="verifyCodeBtn" onclick="verifyEmailCode()">Подтвердить</button>
                <button class="btn btn-primary" onclick="backToEmail()" style="margin-top: 12px; background: var(--coffee-dark);">Изменить email</button>
            </div>

            <!-- Profile Step -->
            <div class="auth-step" id="stepProfile">
                <div class="form-group">
                    <label class="form-label">Имя</label>
                    <input type="text" class="form-input" id="nameInput" placeholder="Иван">
                </div>
                <div class="form-group">
                    <label class="form-label">Фамилия (необязательно)</label>
                    <input type="text" class="form-input" id="lastnameInput" placeholder="Иванов">
                </div>
                <button class="btn btn-primary" onclick="completeRegistration()">Начать общение</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Sicore</div>
                <button class="search-btn" onclick="showSearchModal()">
                    🔍
                </button>
            </div>

            <div class="chats-list" id="chatsList"></div>

            <div class="user-panel" onclick="showMyProfile()">
                <div class="user-avatar" id="userAvatar">
                    <div class="status-badge status-online"></div>
                </div>
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="user-status">в сети</div>
                </div>
            </div>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-area" id="chatArea">
            <div class="empty-chat">
                <h2>Sicore</h2>
                <p>Выберите чат для начала общения</p>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Поиск</div>
                <button class="close-button" onclick="closeModal('searchModal')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <input type="text" class="form-input" id="searchInput" placeholder="Имя или email" oninput="searchUsers()">
                </div>
                <div id="searchResults"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="profileModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <div class="modal-title">Профиль</div>
                <button class="close-button" onclick="closeModal('profileModal')">×</button>
            </div>
            <div class="modal-body" style="padding: 0;">
                <div class="profile-header">
                    <div class="profile-avatar-large" id="profileAvatar" onclick="viewFullAvatar()"></div>
                    <div class="profile-name" id="profileName"></div>
                    <div class="profile-lastname" id="profileLastname"></div>
                    <div class="profile-bio" id="profileBio"></div>
                </div>
                <div class="profile-menu" id="profileMenu"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="editProfileModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Редактировать профиль</div>
                <button class="close-button" onclick="closeModal('editProfileModal')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Имя</label>
                    <input type="text" class="form-input" id="editName">
                </div>
                <div class="form-group">
                    <label class="form-label">Фамилия</label>
                    <input type="text" class="form-input" id="editLastname">
                </div>
                <div class="form-group">
                    <label class="form-label">О себе</label>
                    <input type="text" class="form-input" id="editBio" placeholder="Немного о себе...">
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="privacyModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Приватность</div>
                <button class="close-button" onclick="closeModal('privacyModal')">×</button>
            </div>
            <div class="modal-body">
                <div class="menu-section">
                    <div class="form-group">
                        <label class="form-label">Последнее посещение</label>
                        <div class="menu-item">
                            <span>Показывать время</span>
                            <div class="toggle-switch active" id="showLastSeenToggle" onclick="togglePrivacy(this, 'showLastSeen')"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Фото профиля</label>
                        <select id="showPhotoSelect" onchange="updatePrivacy('showPhoto', this.value)">
                            <option value="everyone">Все</option>
                            <option value="contacts">Только контакты</option>
                            <option value="nobody">Никто</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Кто может писать</label>
                        <select id="whoCanMessageSelect" onchange="updatePrivacy('whoCanMessage', this.value)">
                            <option value="everyone">Все</option>
                            <option value="nobody">Никто</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">О себе</label>
                        <select id="showBioSelect" onchange="updatePrivacy('showBio', this.value)">
                            <option value="everyone">Все</option>
                            <option value="contacts">Только контакты</option>
                            <option value="nobody">Никто</option>
                        </select>
                    </div>
                </div>
                <div class="menu-section">
                    <div class="menu-item danger" onclick="logout()">
                        <span>Выйти из аккаунта</span>
                    </div>
                    <div class="menu-item danger" onclick="confirmDeleteAccount()">
                        <span>Удалить аккаунт</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="emoji-picker" id="emojiPicker">
        <div class="emoji-tabs">
            <button class="emoji-tab active" onclick="switchEmojiTab('emoji')">Эмодзи</button>
            <button class="emoji-tab" onclick="switchEmojiTab('gif')">GIF</button>
            <button class="emoji-tab" onclick="switchEmojiTab('stickers')">Стикеры</button>
        </div>
        <div id="emojiContent"></div>
    </div>

    <div class="context-menu" id="contextMenu"></div>

    <div class="image-viewer" id="imageViewer">
        <button class="image-viewer-close" onclick="closeImageViewer()">×</button>
        <img id="viewerImage">
    </div>

    <div class="avatar-editor" id="avatarEditor">
        <div class="avatar-preview-large">
            <img id="avatarPreview">
        </div>
        <div class="avatar-controls">
            <button class="btn btn-primary" onclick="confirmAvatar()">Сохранить</button>
            <button class="btn btn-primary" onclick="closeAvatarEditor()" style="background: var(--danger);">Отмена</button>
        </div>
    </div>

    <input type="file" id="avatarInput" accept="image/*" style="display: none;">
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
    <audio id="notificationSound" src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE=" preload="auto"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let currentChat = null;
        let chats = new Map();
        let allUsers = new Map();
        let pendingImage = null;
        let selectedGifs = [];
        let longPressTimer = null;
        let longPressChat = null;

        const emojis = ['😀','😁','😂','🤣','😃','😄','😅','😆','😉','😊','😋','😎','😍','😘','🥰','😗','😙','😚','☺️','🙂','🤗','🤩','🤔','🤨','😐','😑','😶','🙄','😏','😣','😥','😮','🤐','😯','😪','😫','😴','😌','😛','😜','😝','🤤','😒','😓','😔','😕','🙃','🤑','😲','☹️','🙁','😖','😞','😟','😤','😢','😭','😦','😧','😨','😩','🤯','😬','😰','😱','🥵','🥶','😳','🤪','😵','😡','😠','🤬','😷','🤒','🤕','🤢','🤮','🤧','😇','🤠','🤡','🥳','🥴','🥺','🤥','🤫','🤭','🧐','🤓','😈','👿','👹','👺','💀','☠️','👻','👽','👾','🤖','💩','😺','😸','😹','😻','😼','😽','🙀','😿','😾','👋','🤚','🖐️','✋','🖖','👌','🤌','🤏','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','🖕','👇','☝️','👍','👎','✊','👊','🤛','🤜','👏','🙌','👐','🤲','🤝','🙏','✍️','💅','🤳','💪','🦾','🦵','🦿','🦶','👂','🦻','👃','🧠','🫀','🫁','🦷','🦴','👀','👁️','👅','👄','💋','🩸'];

        // ==================== AUTH ====================
        async function sendEmailCode() {
            const email = document.getElementById('emailInput').value.trim();
            const errorDiv = document.getElementById('emailError');
            const btn = document.getElementById('sendEmailBtn');
            
            errorDiv.innerHTML = '';

            if (!email || !email.includes('@')) {
                errorDiv.innerHTML = '<div class="error-message">Введите корректный email</div>';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="loading"></div>';

            try {
                const response = await fetch('/api/send-email-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    switchStep('stepEmail', 'stepCode');
                    document.getElementById('emailDisplay').textContent = email;
                    document.getElementById('code1').focus();
                } else {
                    errorDiv.innerHTML = `<div class="error-message">${data.message}</div>`;
                }
            } catch (error) {
                errorDiv.innerHTML = '<div class="error-message">Ошибка отправки. Проверьте настройки сервера.</div>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Получить код';
            }
        }

        async function verifyEmailCode() {
            const code = Array.from({length: 6}, (_, i) => document.getElementById(`code${i+1}`).value).join('');
            const email = document.getElementById('emailInput').value.trim();
            const errorDiv = document.getElementById('codeError');
            const btn = document.getElementById('verifyCodeBtn');

            errorDiv.innerHTML = '';

            if (code.length < 6) {
                errorDiv.innerHTML = '<div class="error-message">Введите полный код</div>';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="loading"></div>';

            try {
                const response = await fetch('/api/verify-email-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });

                const data = await response.json();

                if (data.success) {
                    if (data.isNewUser) {
                        switchStep('stepCode', 'stepProfile');
                    } else {
                        socket.emit('login', { email });
                    }
                } else {
                    errorDiv.innerHTML = `<div class="error-message">${data.message}</div>`;
                    clearCodeInputs();
                    document.getElementById('code1').focus();
                }
            } catch (error) {
                errorDiv.innerHTML = '<div class="error-message">Ошибка проверки кода</div>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Подтвердить';
            }
        }

        function completeRegistration() {
            const name = document.getElementById('nameInput').value.trim();
            const lastname = document.getElementById('lastnameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();

            if (!name) {
                alert('Введите ваше имя');
                return;
            }

            socket.emit('register', {
                name: name,
                lastname: lastname,
                email: email,
                twoFactorAuth: false
            });
        }

        function switchStep(fromId, toId) {
            document.getElementById(fromId).classList.remove('active');
            setTimeout(() => {
                document.getElementById(toId).classList.add('active');
            }, 300);
        }

        function backToEmail() {
            switchStep('stepCode', 'stepEmail');
            clearCodeInputs();
        }

        function clearCodeInputs() {
            for (let i = 1; i <= 6; i++) {
                document.getElementById(`code${i}`).value = '';
            }
        }

        // Code inputs auto-navigation
        document.addEventListener('DOMContentLoaded', () => {
            const codeInputs = document.querySelectorAll('.code-input');
            
            codeInputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1 && index < codeInputs.length - 1) {
                        codeInputs[index + 1].focus();
                    } else if (e.target.value.length === 1 && index === codeInputs.length - 1) {
                        verifyEmailCode();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        codeInputs[index - 1].focus();
                    }
                });

                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const paste = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
                    paste.split('').forEach((char, i) => {
                        if (codeInputs[i]) codeInputs[i].value = char;
                    });
                    if (paste.length === 6) verifyEmailCode();
                });
            });

            // Avatar input
            document.getElementById('avatarInput').addEventListener('change', handleAvatarSelect);
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
        });

        // ==================== SOCKET EVENTS ====================
        socket.on('init', (data) => {
            currentUser = data.user;
            
            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('userAvatar').textContent = currentUser.name[0].toUpperCase();

            if (currentUser.avatar) {
                document.getElementById('userAvatar').innerHTML = `<img src="${currentUser.avatar}"><div class="status-badge status-online"></div>`;
            }

            data.chats.forEach(chat => chats.set(chat.id, chat));
            data.users.forEach(user => allUsers.set(user.id, user));

            renderChats();
            startRealtimeUpdates();

            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('app').style.display = 'grid';
        });

        socket.on('new-message', (data) => {
            const chat = chats.get(data.chatId);
            if (chat) {
                if (!chat.messages) chat.messages = [];
                chat.messages.push(data.message);
                chat.lastMessage = data.message.text || 'Изображение';
                chat.lastMessageTime = data.message.timestamp;
                
                renderChats();
                
                if (currentChat === data.chatId) {
                    renderMessages();
                }
            }
        });

        socket.on('chat-updated', (chat) => {
            chats.set(chat.id, chat);
            renderChats();
        });

        socket.on('chat-created', (chat) => {
            chats.set(chat.id, chat);
            renderChats();
            openChat(chat.id);
        });

        socket.on('chat-deleted', (chatId) => {
            chats.delete(chatId);
            if (currentChat === chatId) {
                currentChat = null;
                showEmptyChat();
            }
            renderChats();
        });

        socket.on('user-status', (data) => {
            const user = allUsers.get(data.userId);
            if (user) {
                user.status = data.status;
                user.lastSeen = data.lastSeen;
                renderChats();
                if (currentChat) {
                    const chat = chats.get(currentChat);
                    if (chat && chat.userId === data.userId) {
                        updateChatHeaderStatus();
                    }
                }
            }
        });

        socket.on('user-updated', (data) => {
            const user = allUsers.get(data.userId);
            if (user) {
                Object.assign(user, data);
                renderChats();
                if (currentChat) {
                    const chat = chats.get(currentChat);
                    if (chat && chat.userId === data.userId) {
                        updateChatHeader(chat);
                    }
                }
            }
        });

        socket.on('notification-sound', () => {
            document.getElementById('notificationSound').play();
        });

        socket.on('chat-restricted', () => {
            alert('Этот пользователь ограничил отправку сообщений');
        });

        socket.on('account-deleted', () => {
            localStorage.clear();
            location.reload();
        });

        // ==================== CHATS ====================
        function renderChats() {
            const chatsList = document.getElementById('chatsList');
            const chatsArray = Array.from(chats.values())
                .sort((a, b) => {
                    if (a.pinned && !b.pinned) return -1;
                    if (!a.pinned && b.pinned) return 1;
                    return (b.lastMessageTime || 0) - (a.lastMessageTime || 0);
                });

            chatsList.innerHTML = chatsArray.map(chat => {
                const isActive = currentChat === chat.id;
                const statusClass = chat.status === 'online' ? 'status-online' : 'status-offline';
                const avatar = chat.avatar || chat.name[0].toUpperCase();
                const muteIcon = chat.muted ? '<span class="mute-icon">🔕</span>' : '';

                return `
                    <div class="chat-item ${isActive ? 'active' : ''} ${chat.pinned ? 'pinned' : ''}" 
                         onclick="openChat('${chat.id}')"
                         onmousedown="startLongPress('${chat.id}')"
                         onmouseup="endLongPress()"
                         onmouseleave="endLongPress()"
                         ontouchstart="startLongPress('${chat.id}')"
                         ontouchend="endLongPress()">
                        <div class="chat-avatar">
                            ${chat.avatar ? `<img src="${chat.avatar}">` : avatar}
                            <div class="status-badge ${statusClass}"></div>
                        </div>
                        <div class="chat-info">
                            <div class="chat-name">${chat.name}</div>
                            <div class="chat-last-message">${muteIcon} ${chat.lastMessage || 'Нет сообщений'}</div>
                        </div>
                        <div class="chat-meta">
                            <div class="chat-time">${chat.lastMessageTime ? formatTime(chat.lastMessageTime) : ''}</div>
                            ${chat.unread ? `<div class="unread-badge">${chat.unread}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openChat(chatId) {
            currentChat = chatId;
            const chat = chats.get(chatId);
            
            chat.unread = 0;
            renderChats();

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('mobile-hidden');
                document.getElementById('chatArea').classList.add('mobile-active');
            }

            const chatArea = document.getElementById('chatArea');
            const statusText = chat.status === 'online' ? 'в сети' : (currentUser.privacy?.showLastSeen !== false ? `был(а) ${formatLastSeen(chat.lastSeen)}` : 'был(а) недавно');
            const statusClass = chat.status === 'online' ? 'online' : 'offline';
            const bgStyle = chat.background ? `background-image: url(${chat.background}); background-size: cover;` : '';

            // Проверяем блокировку
            const isBlocked = currentUser.blockedUsers?.includes(chat.userId);
            const isBotChat = chat.isBot;

            let inputArea = '';
            if (isBlocked) {
                inputArea = '<div class="blocked-message">Пользователь заблокирован</div>';
            } else if (isBotChat) {
                inputArea = '<div class="bot-message">Боту нельзя писать</div>';
            } else {
                inputArea = `
                    <div class="message-input-container">
                        <div class="image-preview" id="imagePreview">
                            <img id="previewImage">
                            <button class="remove-preview" onclick="removeImagePreview()">×</button>
                        </div>
                        <div class="message-input-wrapper">
                            <div class="input-actions">
                                <button class="attach-btn" onclick="attachFile()">📎</button>
                                <button class="emoji-btn" onclick="toggleEmojiPicker()">😊</button>
                            </div>
                            <textarea class="message-input" id="messageInput" placeholder="Сообщение..." rows="1" onkeypress="handleEnter(event)" oninput="autoResize(this)"></textarea>
                            <button class="send-button" onclick="sendMessage()">➤</button>
                        </div>
                    </div>
                `;
            }

            chatArea.innerHTML = `
                <div class="chat-header" onclick="showUserProfile('${chat.userId}')">
                    <button class="back-button" onclick="closeChat(); event.stopPropagation();">←</button>
                    <div class="chat-avatar">
                        ${chat.avatar ? `<img src="${chat.avatar}">` : chat.name[0].toUpperCase()}
                        <div class="status-badge ${statusClass}"></div>
                    </div>
                    <div class="chat-header-info">
                        <div class="chat-header-name">${chat.name}</div>
                        <div class="chat-header-status ${statusClass}" id="chatHeaderStatus">${statusText}</div>
                    </div>
                </div>
                <div class="messages-container" id="messagesContainer" style="${bgStyle}"></div>
                ${inputArea}
            `;

            renderMessages();
        }

        function renderMessages() {
            const chat = chats.get(currentChat);
            if (!chat) return;

            const container = document.getElementById('messagesContainer');
            const messages = chat.messages || [];

            container.innerHTML = messages.map(msg => {
                const isOwn = msg.from === currentUser.id;
                const sender = allUsers.get(msg.from) || (msg.from === 'sicore_bot' ? {name: 'Sicore Bot', avatar: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4noFv9j8OCSQBmThkRcw0HZTn6WJDJ4rYCw&s'} : {});
                const senderName = isOwn ? currentUser.name : sender.name;
                const avatar = isOwn ? currentUser.avatar : sender.avatar;

                let content = '';
                if (msg.image) {
                    content = `<img src="${msg.image}" class="message-image" onclick="viewImage('${msg.image}')">`;
                }
                if (msg.text) {
                    content += `<div class="message-text">${escapeHtml(msg.text)}</div>`;
                }

                return `
                    <div class="message ${isOwn ? 'own' : ''}">
                        <div class="message-avatar" onclick="showUserProfile('${msg.from}')">
                            ${avatar ? `<img src="${avatar}">` : senderName[0].toUpperCase()}
                        </div>
                        <div class="message-content">
                            <div class="message-bubble">${content}</div>
                            <div class="message-time">${formatTime(msg.timestamp)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input?.value.trim();

            if ((text || pendingImage) && currentChat) {
                socket.emit('send-message', {
                    chatId: currentChat,
                    text: text,
                    image: pendingImage
                });
                if (input) {
                    input.value = '';
                    input.style.height = 'auto';
                }
                pendingImage = null;
                document.getElementById('imagePreview')?.classList.remove('active');
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function closeChat() {
            document.getElementById('sidebar').classList.remove('mobile-hidden');
            document.getElementById('chatArea').classList.remove('mobile-active');
        }

        function updateChatHeaderStatus() {
            const chat = chats.get(currentChat);
            if (!chat) return;
            
            const user = allUsers.get(chat.userId);
            const statusEl = document.getElementById('chatHeaderStatus');
            if (statusEl && user) {
                const statusText = user.status === 'online' ? 'в сети' : `был(а) ${formatLastSeen(user.lastSeen)}`;
                statusEl.textContent = statusText;
                statusEl.className = user.status === 'online' ? 'chat-header-status online' : 'chat-header-status offline';
            }
        }

        function updateChatHeader(chat) {
            const headerName = document.querySelector('.chat-header-name');
            if (headerName) {
                headerName.textContent = chat.name;
            }
        }

        function showEmptyChat() {
            document.getElementById('chatArea').innerHTML = `
                <div class="empty-chat">
                    <h2>Sicore</h2>
                    <p>Выберите чат для начала общения</p>
                </div>
            `;
        }

        // ==================== FILE HANDLING ====================
        function attachFile() {
            document.getElementById('fileInput').click();
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    pendingImage = event.target.result;
                    document.getElementById('previewImage').src = pendingImage;
                    document.getElementById('imagePreview').classList.add('active');
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImagePreview() {
            pendingImage = null;
            document.getElementById('imagePreview').classList.remove('active');
        }

        function viewImage(src) {
            document.getElementById('viewerImage').src = src;
            document.getElementById('imageViewer').classList.add('active');
        }

        function closeImageViewer() {
            document.getElementById('imageViewer').classList.remove('active');
        }

        // ==================== AVATAR ====================
        function handleAvatarSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('avatarPreview').src = event.target.result;
                    document.getElementById('avatarEditor').classList.add('active');
                };
                reader.readAsDataURL(file);
            }
        }

        function confirmAvatar() {
            const avatar = document.getElementById('avatarPreview').src;
            currentUser.avatar = avatar;
            
            document.getElementById('userAvatar').innerHTML = `<img src="${avatar}"><div class="status-badge status-online"></div>`;
            document.getElementById('profileAvatar').innerHTML = `<img src="${avatar}">`;
            
            socket.emit('update-profile', { avatar });
            closeAvatarEditor();
        }

        function closeAvatarEditor() {
            document.getElementById('avatarEditor').classList.remove('active');
        }

        function viewFullAvatar() {
            if (currentUser.avatar) {
                viewImage(currentUser.avatar);
            }
        }

        // ==================== EMOJI/GIF ====================
        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.classList.toggle('active');
            if (picker.classList.contains('active')) {
                renderEmojis();
            }
        }

        function switchEmojiTab(tab) {
            document.querySelectorAll('.emoji-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'emoji') renderEmojis();
            else if (tab === 'gif') renderGifs();
            else renderStickers();
        }

        function renderEmojis() {
            const content = document.getElementById('emojiContent');
            content.innerHTML = `
                <div class="emoji-grid">
                    ${emojis.map(emoji => `<div class="emoji-item" onclick="insertEmoji('${emoji}')">${emoji}</div>`).join('')}
                </div>
            `;
        }

        function renderGifs() {
            const content = document.getElementById('emojiContent');
            content.innerHTML = `
                <div style="margin-bottom: 12px;">
                    <button class="btn btn-primary" onclick="addGif()">+ Добавить GIF</button>
                </div>
                <div class="gif-grid" id="gifGrid">
                    ${selectedGifs.map((gif, i) => `
                        <div class="gif-item" onclick="sendGif('${gif}')">
                            <img src="${gif}">
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderStickers() {
            const content = document.getElementById('emojiContent');
            content.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--accent);">Стикеры скоро появятся</div>';
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            if (input) {
                input.value += emoji;
                input.focus();
            }
            document.getElementById('emojiPicker').classList.remove('active');
        }

        function sendGif(gif) {
            if (currentChat) {
                socket.emit('send-message', {
                    chatId: currentChat,
                    text: null,
                    image: gif
                });
            }
            document.getElementById('emojiPicker').classList.remove('active');
        }

        function addGif() {
            const url = prompt('Вставьте URL GIF:');
            if (url) {
                selectedGifs.push(url);
                renderGifs();
            }
        }

        // ==================== LONG PRESS ====================
        function startLongPress(chatId) {
            longPressChat = chatId;
            longPressTimer = setTimeout(() => {
                showChatContextMenu(chatId, event);
            }, 500);
        }

        function endLongPress() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        function showChatContextMenu(chatId, e) {
            const chat = chats.get(chatId);
            if (!chat || chat.isBot) return;

            const menu = document.getElementById('contextMenu');
            const items = [
                { label: chat.pinned ? '📌 Открепить' : '📌 Закрепить', action: () => togglePin(chatId) },
                { label: chat.muted ? '🔔 Включить звук' : '🔕 Выключить звук', action: () => toggleMute(chatId) },
                { label: currentUser.blockedUsers?.includes(chat.userId) ? '🔓 Разблокировать' : '🔒 Заблокировать', action: () => toggleBlock(chatId) },
                { label: '🗑️ Удалить чат', action: () => deleteChat(chatId), danger: true }
            ];

            menu.innerHTML = items.map(item => `
                <div class="context-menu-item ${item.danger ? 'danger' : ''}" onclick="${item.action.toString().match(/\{(.*)\}/s)[1]};closeContextMenu()">
                    ${item.label}
                </div>
            `).join('');

            menu.style.left = e.pageX + 'px';
            menu.style.top = e.pageY + 'px';
            menu.classList.add('active');
        }

        function closeContextMenu() {
            document.getElementById('contextMenu').classList.remove('active');
        }

        function togglePin(chatId) {
            socket.emit('pin-chat', chatId);
        }

        function toggleMute(chatId) {
            socket.emit('mute-chat', chatId);
        }

        function toggleBlock(chatId) {
            const chat = chats.get(chatId);
            if (currentUser.blockedUsers?.includes(chat.userId)) {
                socket.emit('unblock-user', chat.userId);
                currentUser.blockedUsers = currentUser.blockedUsers.filter(id => id !== chat.userId);
            } else {
                socket.emit('block-user', chat.userId);
                if (!currentUser.blockedUsers) currentUser.blockedUsers = [];
                currentUser.blockedUsers.push(chat.userId);
            }
            if (currentChat === chatId) {
                openChat(chatId);
            }
        }

        function deleteChat(chatId) {
            const forEveryone = confirm('Удалить для всех?');
            socket.emit('delete-chat', { chatId, forEveryone });
        }

        // ==================== PROFILE ====================
        function showMyProfile() {
            showProfile(currentUser);
        }

        function showUserProfile(userId) {
            if (userId === currentUser.id) {
                showMyProfile();
                return;
            }
            
            const user = userId === 'sicore_bot' 
                ? { id: 'sicore_bot', name: 'Sicore', lastname: 'Bot', bio: 'Официальный бот Sicore', avatar: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4noFv9j8OCSQBmThkRcw0HZTn6WJDJ4rYCw&s' }
                : allUsers.get(userId);
            
            if (user) {
                showProfile(user);
            }
        }

        function showProfile(user) {
            const isOwnProfile = user.id === currentUser.id;
            
            document.getElementById('profileAvatar').innerHTML = user.avatar 
                ? `<img src="${user.avatar}">`
                : user.name[0].toUpperCase();
            
            const names = user.name.split(' ');
            document.getElementById('profileName').textContent = names[0] || user.name;
            document.getElementById('profileLastname').textContent = user.lastname || names[1] || '';
            document.getElementById('profileBio').textContent = user.bio || (isOwnProfile ? 'Нет описания' : '');

            const menu = document.getElementById('profileMenu');
            
            if (isOwnProfile) {
                menu.innerHTML = `
                    <div class="menu-section">
                        <div class="menu-item" onclick="editProfile()">
                            <span>✏️ Редактировать профиль</span>
                            <span>›</span>
                        </div>
                        <div class="menu-item" onclick="document.getElementById('avatarInput').click()">
                            <span>📷 Изменить фото</span>
                            <span>›</span>
                        </div>
                    </div>
                    <div class="menu-section">
                        <div class="menu-item" onclick="showPrivacySettings()">
                            <span>🔒 Приватность и безопасность</span>
                            <span>›</span>
                        </div>
                    </div>
                `;
            } else {
                menu.innerHTML = `
                    <div class="menu-section">
                        <div class="menu-item" onclick="closeModal('profileModal'); socket.emit('create-chat', '${user.id}')">
                            <span>💬 Написать сообщение</span>
                        </div>
                    </div>
                `;
            }

            document.getElementById('profileModal').classList.add('active');
        }

        function editProfile() {
            document.getElementById('editName').value = currentUser.name.split(' ')[0] || '';
            document.getElementById('editLastname').value = currentUser.lastname || currentUser.name.split(' ')[1] || '';
            document.getElementById('editBio').value = currentUser.bio || '';
            
            closeModal('profileModal');
            document.getElementById('editProfileModal').classList.add('active');

            // Auto-save on input
            ['editName', 'editLastname', 'editBio'].forEach(id => {
                document.getElementById(id).addEventListener('input', debounce(() => {
                    const name = document.getElementById('editName').value.trim();
                    const lastname = document.getElementById('editLastname').value.trim();
                    const bio = document.getElementById('editBio').value.trim();
                    
                    if (name) {
                        socket.emit('update-profile', {
                            name: `${name} ${lastname}`.trim(),
                            lastname: lastname,
                            bio: bio
                        });
                        
                        currentUser.name = name;
                        currentUser.lastname = lastname;
                        currentUser.bio = bio;
                        document.getElementById('userName').textContent = name;
                    }
                }, 1000));
            });
        }

        function showPrivacySettings() {
            closeModal('profileModal');
            
            // Set current values
            if (currentUser.privacy) {
                document.getElementById('showLastSeenToggle').classList.toggle('active', currentUser.privacy.showLastSeen);
                document.getElementById('showPhotoSelect').value = currentUser.privacy.showPhoto || 'everyone';
                document.getElementById('whoCanMessageSelect').value = currentUser.privacy.whoCanMessage || 'everyone';
                document.getElementById('showBioSelect').value = currentUser.privacy.showBio || 'everyone';
            }
            
            document.getElementById('privacyModal').classList.add('active');
        }

        function togglePrivacy(element, setting) {
            element.classList.toggle('active');
            updatePrivacy(setting, element.classList.contains('active'));
        }

        function updatePrivacy(setting, value) {
            if (!currentUser.privacy) currentUser.privacy = {};
            currentUser.privacy[setting] = value;
            socket.emit('update-privacy', { [setting]: value });
        }

        function logout() {
            if (confirm('Выйти из аккаунта?')) {
                localStorage.clear();
                location.reload();
            }
        }

        function confirmDeleteAccount() {
            if (confirm('ВНИМАНИЕ! Вы действительно хотите удалить аккаунт? Это действие нельзя отменить!')) {
                if (confirm('Все ваши данные будут удалены навсегда. Продолжить?')) {
                    socket.emit('delete-account');
                }
            }
        }

        // ==================== SEARCH ====================
        function showSearchModal() {
            document.getElementById('searchModal').classList.add('active');
            setTimeout(() => document.getElementById('searchInput').focus(), 100);
        }

        function searchUsers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const resultsDiv = document.getElementById('searchResults');

            if (!query) {
                resultsDiv.innerHTML = '';
                return;
            }

            const results = Array.from(allUsers.values())
                .filter(user => 
                    user.name.toLowerCase().includes(query) || 
                    user.email?.toLowerCase().includes(query)
                );

            resultsDiv.innerHTML = results.map(user => `
                <div class="chat-item" onclick="startChatWith('${user.id}')">
                    <div class="chat-avatar">
                        ${user.avatar ? `<img src="${user.avatar}">` : user.name[0].toUpperCase()}
                        <div class="status-badge status-${user.status}"></div>
                    </div>
                    <div class="chat-info">
                        <div class="chat-name">${user.name}</div>
                        <div class="chat-last-message">${user.email || ''}</div>
                    </div>
                </div>
            `).join('');
        }

        function startChatWith(userId) {
            socket.emit('create-chat', userId);
            closeModal('searchModal');
        }

        // ==================== UTILS ====================
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return 'только что';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' мин';
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            }
            if (diff < 86400000 * 2) return 'вчера';
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        }

        function formatLastSeen(timestamp) {
            if (!timestamp) return 'недавно';
            const diff = Date.now() - timestamp;
            
            if (diff < 60000) return 'только что';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} мин назад`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)} ч назад`;
            return new Date(timestamp).toLocaleDateString('ru-RU');
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function startRealtimeUpdates() {
            setInterval(() => {
                document.querySelectorAll('.chat-time').forEach(el => {
                    const time = el.textContent;
                    if (time) {
                        // Update if needed
                    }
                });
            }, 30000);
        }

        // Close modals on outside click
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('active');
            }
            
            const emojiPicker = document.getElementById('emojiPicker');
            const emojiBtn = document.querySelector('.emoji-btn');
            if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
                emojiPicker.classList.remove('active');
            }
            
            const contextMenu = document.getElementById('contextMenu');
            if (!contextMenu.contains(e.target)) {
                contextMenu.classList.remove('active');
            }
        });
    </script>
</body>
</html>
