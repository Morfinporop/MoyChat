<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sicore - Без блокировок и ограничений</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --coffee-dark: #1a1512;
            --coffee-brown: #2b2017;
            --coffee-medium: #3d2e26;
            --coffee-light: #6b5449;
            --cream: #f5f1ed;
            --cream-dark: #d4cfc9;
            --accent: #b8956a;
            --online: #43b581;
            --offline: #747f8d;
            --danger: #ed4245;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--coffee-dark);
            color: var(--cream);
            height: 100vh;
            overflow: hidden;
        }

        /* ========== LOGIN ========== */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--coffee-dark) 0%, var(--coffee-brown) 100%);
        }

        .login-box {
            background: rgba(43, 32, 23, 0.95);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(184, 149, 106, 0.2);
            min-width: 380px;
            max-width: 90%;
        }

        .login-box h1 {
            font-size: 32px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--cream) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .login-box p {
            color: var(--accent);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(26, 21, 18, 0.6);
            border: 2px solid var(--coffee-medium);
            border-radius: 8px;
            color: var(--cream);
            font-size: 15px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent) 0%, #9d7d54 100%);
            border: none;
            border-radius: 8px;
            color: var(--coffee-dark);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(184, 149, 106, 0.4);
        }

        /* ========== APP ========== */
        #app {
            display: none;
            height: 100vh;
            grid-template-columns: 72px 240px 1fr;
        }

        /* ========== SERVERS SIDEBAR ========== */
        .servers-sidebar {
            background: var(--coffee-dark);
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            overflow-y: auto;
            border-right: 1px solid rgba(184, 149, 106, 0.1);
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background: var(--coffee-brown);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .server-icon svg {
            width: 24px;
            height: 24px;
            fill: var(--cream);
        }

        .server-icon:hover {
            border-radius: 16px;
            background: var(--accent);
        }

        .server-icon.active {
            border-radius: 16px;
            background: var(--accent);
        }

        .server-icon.active::before {
            content: '';
            position: absolute;
            left: -12px;
            width: 4px;
            height: 36px;
            background: var(--cream);
            border-radius: 0 4px 4px 0;
        }

        .server-divider {
            width: 32px;
            height: 2px;
            background: var(--coffee-medium);
            border-radius: 1px;
        }

        .user-panel {
            margin-top: auto;
            width: 100%;
            padding: 8px;
        }

        .user-settings-btn {
            width: 48px;
            height: 48px;
            background: var(--coffee-brown);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0 auto;
        }

        .user-settings-btn:hover {
            background: var(--accent);
        }

        .user-settings-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--cream);
        }

        /* ========== CHANNELS SIDEBAR ========== */
        .channels-sidebar {
            background: var(--coffee-brown);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(184, 149, 106, 0.1);
        }

        .server-header {
            padding: 16px;
            border-bottom: 1px solid rgba(184, 149, 106, 0.1);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .server-header:hover {
            background: rgba(184, 149, 106, 0.05);
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 8px;
        }

        .channel-category {
            margin-bottom: 20px;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            margin-bottom: 4px;
        }

        .category-title {
            font-size: 11px;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .add-channel-btn {
            width: 16px;
            height: 16px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .add-channel-btn:hover {
            opacity: 1;
        }

        .add-channel-btn svg {
            width: 16px;
            height: 16px;
            fill: var(--cream);
        }

        .channel-item {
            padding: 6px 8px;
            margin: 1px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--cream-dark);
        }

        .channel-item svg {
            width: 18px;
            height: 18px;
            fill: var(--cream-dark);
        }

        .channel-item:hover {
            background: rgba(184, 149, 106, 0.1);
            color: var(--cream);
        }

        .channel-item:hover svg {
            fill: var(--cream);
        }

        .channel-item.active {
            background: var(--coffee-medium);
            color: var(--cream);
        }

        .channel-item.active svg {
            fill: var(--cream);
        }

        .user-footer {
            padding: 12px;
            border-top: 1px solid rgba(184, 149, 106, 0.1);
            background: rgba(26, 21, 18, 0.3);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            position: relative;
            flex-shrink: 0;
        }

        .status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--coffee-brown);
            background: var(--online);
        }

        .user-details {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-status {
            font-size: 11px;
            color: var(--accent);
        }

        .settings-icon {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background: rgba(184, 149, 106, 0.1);
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-icon:hover {
            background: var(--accent);
        }

        .settings-icon svg {
            width: 16px;
            height: 16px;
            fill: var(--cream);
        }

        /* ========== CHAT CONTAINER ========== */
        .chat-container {
            display: flex;
            flex-direction: column;
            background: var(--coffee-dark);
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(184, 149, 106, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(43, 32, 23, 0.4);
        }

        .chat-header h2 {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
        }

        .header-icons {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 24px;
            height: 24px;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            opacity: 1;
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--cream);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .message:hover {
            background: rgba(184, 149, 106, 0.05);
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 2px;
        }

        .message-username {
            font-weight: 600;
            font-size: 15px;
        }

        .message-time {
            font-size: 11px;
            color: var(--accent);
        }

        .message-text {
            color: var(--cream-dark);
            line-height: 1.4;
            font-size: 15px;
        }

        .message-input-area {
            padding: 16px;
            background: rgba(43, 32, 23, 0.4);
        }

        .message-input-wrapper {
            display: flex;
            gap: 8px;
            background: var(--coffee-brown);
            border-radius: 8px;
            padding: 10px 12px;
            border: 2px solid transparent;
            transition: border 0.3s;
        }

        .message-input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .message-input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            color: var(--cream);
            font-size: 14px;
        }

        .message-input-wrapper input:focus {
            outline: none;
        }

        .send-btn {
            background: var(--accent);
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            color: var(--coffee-dark);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .send-btn:hover {
            background: var(--coffee-light);
        }

        /* ========== MEMBERS SIDEBAR ========== */
        .members-sidebar {
            background: var(--coffee-brown);
            padding: 16px 12px;
            overflow-y: auto;
            border-left: 1px solid rgba(184, 149, 106, 0.1);
            width: 240px;
        }

        .members-section {
            margin-bottom: 20px;
        }

        .members-title {
            font-size: 11px;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 2px;
        }

        .member-item:hover {
            background: rgba(184, 149, 106, 0.1);
        }

        .member-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            position: relative;
            flex-shrink: 0;
        }

        .member-name {
            font-size: 13px;
            font-weight: 500;
        }

        .add-friend-btn {
            width: 100%;
            padding: 8px;
            background: rgba(184, 149, 106, 0.1);
            border: 2px dashed var(--accent);
            border-radius: 4px;
            color: var(--cream);
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.3s;
            font-size: 13px;
            font-weight: 500;
        }

        .add-friend-btn:hover {
            background: rgba(184, 149, 106, 0.2);
        }

        /* ========== MODALS ========== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--coffee-brown);
            padding: 24px;
            border-radius: 12px;
            min-width: 400px;
            max-width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(184, 149, 106, 0.2);
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: var(--cream);
            font-size: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn-secondary {
            flex: 1;
            padding: 10px;
            background: var(--coffee-medium);
            border: none;
            border-radius: 6px;
            color: var(--cream);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: var(--coffee-light);
        }

        /* ========== SETTINGS MODAL ========== */
        .settings-modal-content {
            min-width: 800px;
            max-width: 90%;
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 0;
            padding: 0;
            max-height: 80vh;
            overflow: hidden;
        }

        .settings-sidebar {
            background: var(--coffee-dark);
            padding: 60px 12px 20px;
            border-radius: 12px 0 0 12px;
        }

        .settings-nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .settings-nav-item {
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--cream-dark);
            font-size: 14px;
        }

        .settings-nav-item:hover {
            background: rgba(184, 149, 106, 0.1);
            color: var(--cream);
        }

        .settings-nav-item.active {
            background: var(--coffee-medium);
            color: var(--cream);
        }

        .settings-main {
            padding: 60px 30px 30px;
            overflow-y: auto;
        }

        .settings-section {
            margin-bottom: 30px;
        }

        .settings-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--cream);
        }

        .close-modal-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(184, 149, 106, 0.1);
            border: none;
            color: var(--cream);
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-modal-btn:hover {
            background: var(--danger);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            #app {
                grid-template-columns: 60px 1fr;
            }

            .channels-sidebar {
                display: none;
            }

            .members-sidebar {
                display: none;
            }

            .servers-sidebar {
                width: 60px;
            }

            .server-icon {
                width: 40px;
                height: 40px;
            }

            .login-box {
                min-width: 300px;
                padding: 30px 20px;
            }

            .settings-modal-content {
                grid-template-columns: 1fr;
                min-width: 90%;
            }

            .settings-sidebar {
                display: none;
            }
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--coffee-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--coffee-medium);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ========== VOICE PANEL ========== */
        .voice-panel {
            background: rgba(43, 32, 23, 0.8);
            padding: 20px;
            border-radius: 8px;
            margin: 16px;
            text-align: center;
            border: 2px solid var(--accent);
        }

        .voice-users {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
            justify-content: center;
        }

        .voice-user {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .voice-user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border: 3px solid var(--online);
        }

        .voice-user-name {
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>Sicore</h1>
            <p>Без блокировок и ограничений</p>
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Введите ваше имя..." maxlength="20">
            </div>
            <button class="btn-primary" onclick="login()">Войти</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <!-- SERVERS SIDEBAR -->
        <div class="servers-sidebar">
            <div class="server-icon active" data-server="default" onclick="switchServer('default')">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            <div class="server-divider"></div>
            <div id="serversList"></div>
            <div class="server-icon" onclick="showCreateServerModal()">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </div>
            <div class="user-panel">
                <div class="user-settings-btn" onclick="showSettings()">
                    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                </div>
            </div>
        </div>

        <!-- CHANNELS SIDEBAR -->
        <div class="channels-sidebar">
            <div class="server-header" id="serverName">Sicore</div>
            <div class="channels-list" id="channelsList">
                <!-- Dynamic content -->
            </div>
            <div class="user-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">
                        <div class="status-dot"></div>
                    </div>
                    <div class="user-details">
                        <div class="user-name" id="currentUsername"></div>
                        <div class="user-status">онлайн</div>
                    </div>
                    <button class="settings-icon" onclick="showSettings()">
                        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- CHAT CONTAINER -->
        <div class="chat-container">
            <div class="chat-header">
                <svg width="20" height="20" viewBox="0 0 24 24" style="fill: var(--cream);"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                <h2 id="currentChannelName">общий-чат</h2>
                <div class="header-icons" style="margin-left: auto;">
                    <div class="icon-btn">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    </div>
                </div>
            </div>

            <div id="voicePanel" style="display: none;" class="voice-panel">
                <h3>Голосовой чат</h3>
                <div id="voiceUsers" class="voice-users"></div>
                <button class="btn-primary" onclick="leaveVoice()" style="margin-top: 16px; max-width: 200px;">Отключиться</button>
            </div>

            <div class="messages-area" id="messagesArea"></div>

            <div class="message-input-area">
                <form class="message-input-wrapper" id="messageForm">
                    <input type="text" id="messageInput" placeholder="Напишите сообщение...">
                    <button type="submit" class="send-btn">Отправить</button>
                </form>
            </div>
        </div>

        <!-- MEMBERS SIDEBAR -->
        <div class="members-sidebar">
            <div class="members-section">
                <div class="members-title">Друзья</div>
                <button class="add-friend-btn" onclick="showAddFriendModal()">+ Добавить друга</button>
                <div id="friendsList"></div>
            </div>
            <div class="members-section">
                <div class="members-title">Участники</div>
                <div id="membersList"></div>
            </div>
        </div>
    </div>

    <!-- ADD FRIEND MODAL -->
    <div id="addFriendModal" class="modal">
        <div class="modal-content">
            <h3>Добавить в друзья</h3>
            <div class="input-group">
                <input type="text" id="friendUsernameInput" placeholder="Имя пользователя">
            </div>
            <div class="modal-buttons">
                <button class="btn-primary" onclick="addFriend()">Добавить</button>
                <button class="btn-secondary" onclick="closeModal('addFriendModal')">Отмена</button>
            </div>
        </div>
    </div>

    <!-- CREATE SERVER MODAL -->
    <div id="createServerModal" class="modal">
        <div class="modal-content">
            <h3>Создать сервер</h3>
            <div class="input-group">
                <input type="text" id="serverNameInput" placeholder="Название сервера">
            </div>
            <div class="modal-buttons">
                <button class="btn-primary" onclick="createServer()">Создать</button>
                <button class="btn-secondary" onclick="closeModal('createServerModal')">Отмена</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="modal">
        <div class="modal-content settings-modal-content" style="position: relative;">
            <button class="close-modal-btn" onclick="closeModal('settingsModal')">×</button>
            <div class="settings-sidebar">
                <div class="settings-nav">
                    <div class="settings-nav-item active">Профиль</div>
                    <div class="settings-nav-item">Приватность</div>
                    <div class="settings-nav-item">Уведомления</div>
                    <div class="settings-nav-item">Внешний вид</div>
                    <div class="settings-nav-item">Безопасность</div>
                    <div class="settings-nav-item" style="color: var(--danger);" onclick="logout()">Выход</div>
                </div>
            </div>
            <div class="settings-main">
                <div class="settings-section">
                    <h2 class="settings-title">Мой профиль</h2>
                    <div class="input-group">
                        <input type="text" placeholder="Имя пользователя" id="settingsUsername">
                    </div>
                    <div class="input-group">
                        <input type="email" placeholder="Email">
                    </div>
                    <button class="btn-primary">Сохранить изменения</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let currentServer = 'default';
        let currentChannel = 'general';
        let friends = [];
        let servers = [];
        let inVoiceChannel = null;
        let peerConnections = new Map();
        let localStream = null;

        // LOGIN
        function login() {
            const username = document.getElementById('usernameInput').value.trim();
            if (username) {
                socket.emit('register', username);
            }
        }

        document.getElementById('usernameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });

        // SOCKET EVENTS
        socket.on('init', (data) => {
            currentUser = { username: data.username, id: data.userId };
            servers = data.servers;
            friends = data.friends;
            
            document.getElementById('currentUsername').textContent = data.username;
            document.getElementById('userAvatar').textContent = data.username[0].toUpperCase();
            document.getElementById('settingsUsername').value = data.username;
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('app').style.display = 'grid';
            
            renderServers();
            renderChannels();
            renderFriends();
            renderMembers();
        });

        socket.on('new-message', (data) => {
            if (data.channelId === currentChannel) {
                addMessage(data.message);
            }
        });

        socket.on('message-history', (data) => {
            document.getElementById('messagesArea').innerHTML = '';
            data.messages.forEach(msg => addMessage(msg));
        });

        socket.on('friend-added', (friend) => {
            friends.push(friend);
            renderFriends();
        });

        socket.on('server-created', (server) => {
            servers.push(server);
            renderServers();
        });

        socket.on('user-joined-voice', (data) => {
            if (data.channelId === inVoiceChannel) {
                renderVoiceUsers(data.users);
            }
        });

        socket.on('user-left-voice', (data) => {
            if (data.channelId === inVoiceChannel && peerConnections.has(data.userId)) {
                peerConnections.get(data.userId).close();
                peerConnections.delete(data.userId);
            }
        });

        // RENDER FUNCTIONS
        function renderServers() {
            const serversList = document.getElementById('serversList');
            serversList.innerHTML = '';
            
            servers.filter(s => s.id !== 'default').forEach(server => {
                const icon = document.createElement('div');
                icon.className = 'server-icon';
                if (server.id === currentServer) icon.classList.add('active');
                icon.setAttribute('data-server', server.id);
                icon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/></svg>`;
                icon.onclick = () => switchServer(server.id);
                serversList.appendChild(icon);
            });
        }

        function renderChannels() {
            const server = servers.find(s => s.id === currentServer);
            if (!server) return;
            
            document.getElementById('serverName').textContent = server.name;
            
            const channelsList = document.getElementById('channelsList');
            channelsList.innerHTML = '';
            
            // Text channels
            const textCategory = document.createElement('div');
            textCategory.className = 'channel-category';
            textCategory.innerHTML = `
                <div class="category-header">
                    <div class="category-title">Текстовые каналы</div>
                    <div class="add-channel-btn" onclick="addChannel('text')">
                        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    </div>
                </div>
            `;
            
            server.channels.filter(ch => ch.type === 'text').forEach(channel => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                if (channel.id === currentChannel) item.classList.add('active');
                item.innerHTML = `
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                    ${channel.name}
                `;
                item.onclick = () => switchChannel(channel.id, 'text');
                textCategory.appendChild(item);
            });
            
            channelsList.appendChild(textCategory);
            
            // Voice channels
            const voiceCategory = document.createElement('div');
            voiceCategory.className = 'channel-category';
            voiceCategory.innerHTML = `
                <div class="category-header">
                    <div class="category-title">Голосовые каналы</div>
                    <div class="add-channel-btn" onclick="addChannel('voice')">
                        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    </div>
                </div>
            `;
            
            server.channels.filter(ch => ch.type === 'voice').forEach(channel => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.innerHTML = `
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
                    ${channel.name}
                `;
                item.onclick = () => joinVoiceChannel(channel.id);
                voiceCategory.appendChild(item);
            });
            
            channelsList.appendChild(voiceCategory);
        }

        function renderFriends() {
            const friendsList = document.getElementById('friendsList');
            friendsList.innerHTML = '';
            
            friends.forEach(friend => {
                const item = document.createElement('div');
                item.className = 'member-item';
                item.innerHTML = `
                    <div class="member-avatar">
                        ${friend.username[0].toUpperCase()}
                        <div class="status-dot" style="background: ${friend.status === 'online' ? 'var(--online)' : 'var(--offline)'}"></div>
                    </div>
                    <div class="member-name">${friend.username}</div>
                `;
                item.onclick = () => openDM(friend);
                friendsList.appendChild(item);
            });
        }

        function renderMembers() {
            const server = servers.find(s => s.id === currentServer);
            if (!server) return;
            
            const membersList = document.getElementById('membersList');
            membersList.innerHTML = '';
            
            server.members.forEach(memberId => {
                const item = document.createElement('div');
                item.className = 'member-item';
                item.innerHTML = `
                    <div class="member-avatar">U</div>
                    <div class="member-name">User</div>
                `;
                membersList.appendChild(item);
            });
        }

        // SEND MESSAGE
        document.getElementById('messageForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message) {
                socket.emit('send-message', { channelId: currentChannel, message: message });
                input.value = '';
            }
        });

        function addMessage(msg) {
            const messagesArea = document.getElementById('messagesArea');
            const messageEl = document.createElement('div');
            messageEl.className = 'message';
            
            const avatar = msg.username[0].toUpperCase();
            
            messageEl.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-username">${msg.username}</span>
                        <span class="message-time">${msg.time}</span>
                    </div>
                    <div class="message-text">${escapeHtml(msg.message)}</div>
                </div>
            `;
            
            messagesArea.appendChild(messageEl);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // VOICE CHAT
        async function joinVoiceChannel(channelId) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                inVoiceChannel = channelId;
                
                document.getElementById('voicePanel').style.display = 'block';
                
                socket.emit('join-voice', channelId);
            } catch (error) {
                console.error('Microphone error:', error);
            }
        }

        function leaveVoice() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            if (inVoiceChannel) {
                socket.emit('leave-voice', inVoiceChannel);
            }
            
            inVoiceChannel = null;
            document.getElementById('voicePanel').style.display = 'none';
        }

        function renderVoiceUsers(users) {
            const voiceUsers = document.getElementById('voiceUsers');
            voiceUsers.innerHTML = '';
            
            users.forEach(user => {
                const userEl = document.createElement('div');
                userEl.className = 'voice-user';
                userEl.innerHTML = `
                    <div class="voice-user-avatar">${user.username[0].toUpperCase()}</div>
                    <div class="voice-user-name">${user.username}</div>
                `;
                voiceUsers.appendChild(userEl);
            });
        }

        // SWITCH FUNCTIONS
        function switchServer(serverId) {
            currentServer = serverId;
            const server = servers.find(s => s.id === serverId);
            if (server && server.channels.length > 0) {
                const firstTextChannel = server.channels.find(ch => ch.type === 'text');
                if (firstTextChannel) {
                    switchChannel(firstTextChannel.id, 'text');
                }
            }
            renderServers();
            renderChannels();
            renderMembers();
        }

        function switchChannel(channelId, type) {
            currentChannel = channelId;
            
            const server = servers.find(s => s.id === currentServer);
            const channel = server.channels.find(ch => ch.id === channelId);
            
            document.getElementById('currentChannelName').textContent = channel.name;
            document.getElementById('messagesArea').innerHTML = '';
            
            socket.emit('get-channel-messages', channelId);
            renderChannels();
        }

        function openDM(friend) {
            currentChannel = 'dm-' + friend.id;
            document.getElementById('currentChannelName').textContent = '@ ' + friend.username;
            document.getElementById('messagesArea').innerHTML = '';
            socket.emit('get-dm-history', friend.id);
        }

        // MODALS
        function showAddFriendModal() {
            document.getElementById('addFriendModal').classList.add('active');
        }

        function showCreateServerModal() {
            document.getElementById('createServerModal').classList.add('active');
        }

        function showSettings() {
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function addFriend() {
            const username = document.getElementById('friendUsernameInput').value.trim();
            if (username) {
                socket.emit('add-friend', username);
                document.getElementById('friendUsernameInput').value = '';
                closeModal('addFriendModal');
            }
        }

        function createServer() {
            const name = document.getElementById('serverNameInput').value.trim();
            if (name) {
                socket.emit('create-server', name);
                document.getElementById('serverNameInput').value = '';
                closeModal('createServerModal');
            }
        }

        function addChannel(type) {
            const name = prompt(`Название ${type === 'text' ? 'текстового' : 'голосового'} канала:`);
            if (name) {
                socket.emit('create-channel', { serverId: currentServer, name: name, type: type });
            }
        }

        function logout() {
            location.reload();
        }

        // UTILS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
