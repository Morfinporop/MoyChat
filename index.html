<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeChat - Общение с друзьями</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --coffee-dark: #2D1B12;
            --coffee-brown: #3E2723;
            --coffee-medium: #5D4037;
            --coffee-light: #8D6E63;
            --cream: #EFEBE9;
            --cream-dark: #D7CCC8;
            --accent: #A1887F;
            --online: #4CAF50;
            --offline: #9E9E9E;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--coffee-dark) 0%, var(--coffee-brown) 100%);
            color: var(--cream);
            height: 100vh;
            overflow: hidden;
        }

        /* LOGIN SCREEN */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 50%, rgba(141, 110, 99, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(161, 136, 127, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, var(--coffee-dark) 0%, var(--coffee-brown) 100%);
        }

        .login-box {
            background: rgba(62, 39, 35, 0.8);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(161, 136, 127, 0.2);
            min-width: 400px;
        }

        .login-box h1 {
            font-size: 36px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--cream) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .login-box p {
            color: var(--accent);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(45, 27, 18, 0.6);
            border: 2px solid var(--coffee-medium);
            border-radius: 10px;
            color: var(--cream);
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(45, 27, 18, 0.8);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--coffee-medium) 0%, var(--coffee-light) 100%);
            border: none;
            border-radius: 10px;
            color: var(--cream);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(141, 110, 99, 0.4);
        }

        /* MAIN APP */
        #app {
            display: none;
            height: 100vh;
            grid-template-columns: 80px 240px 1fr 280px;
            grid-template-rows: 1fr;
        }

        /* SIDEBAR - Серверы */
        .servers-sidebar {
            background: var(--coffee-dark);
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            overflow-y: auto;
            border-right: 1px solid rgba(161, 136, 127, 0.1);
        }

        .server-icon {
            width: 56px;
            height: 56px;
            background: var(--coffee-brown);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 24px;
            position: relative;
        }

        .server-icon:hover {
            border-radius: 12px;
            background: var(--coffee-medium);
        }

        .server-icon.active {
            border-radius: 12px;
            background: var(--accent);
        }

        .server-icon.active::before {
            content: '';
            position: absolute;
            left: -12px;
            width: 4px;
            height: 40px;
            background: var(--cream);
            border-radius: 0 4px 4px 0;
        }

        /* CHANNELS SIDEBAR */
        .channels-sidebar {
            background: var(--coffee-brown);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(161, 136, 127, 0.1);
        }

        .server-header {
            padding: 16px;
            border-bottom: 1px solid rgba(161, 136, 127, 0.1);
            font-weight: 600;
            font-size: 16px;
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 8px;
        }

        .channel-category {
            margin-bottom: 20px;
        }

        .category-title {
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
            padding: 0 8px;
        }

        .channel-item {
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
        }

        .channel-item:hover {
            background: rgba(161, 136, 127, 0.2);
        }

        .channel-item.active {
            background: var(--coffee-medium);
            color: var(--cream);
        }

        /* CHAT AREA */
        .chat-container {
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, var(--coffee-brown) 0%, var(--coffee-dark) 100%);
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(161, 136, 127, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(45, 27, 18, 0.4);
        }

        .chat-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .message:hover {
            background: rgba(161, 136, 127, 0.1);
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .message-username {
            font-weight: 600;
            color: var(--cream);
        }

        .message-time {
            font-size: 12px;
            color: var(--accent);
        }

        .message-text {
            color: var(--cream-dark);
            line-height: 1.5;
        }

        /* MESSAGE INPUT */
        .message-input-area {
            padding: 20px;
            background: rgba(45, 27, 18, 0.6);
        }

        .message-input-wrapper {
            display: flex;
            gap: 12px;
            background: var(--coffee-dark);
            border-radius: 12px;
            padding: 12px 16px;
            border: 2px solid transparent;
            transition: border 0.3s;
        }

        .message-input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .message-input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            color: var(--cream);
            font-size: 15px;
        }

        .message-input-wrapper input:focus {
            outline: none;
        }

        .send-btn {
            background: var(--accent);
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            color: var(--cream);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-btn:hover {
            background: var(--coffee-light);
        }

        /* MEMBERS SIDEBAR */
        .members-sidebar {
            background: var(--coffee-brown);
            padding: 20px 16px;
            overflow-y: auto;
            border-left: 1px solid rgba(161, 136, 127, 0.1);
        }

        .members-section {
            margin-bottom: 24px;
        }

        .members-title {
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .member-item:hover {
            background: rgba(161, 136, 127, 0.2);
        }

        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            position: relative;
        }

        .status-indicator {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--coffee-brown);
        }

        .status-online { background: var(--online); }
        .status-offline { background: var(--offline); }

        .member-name {
            font-size: 14px;
            font-weight: 500;
        }

        /* BUTTONS */
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(161, 136, 127, 0.2);
            border: none;
            color: var(--cream);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: var(--accent);
        }

        /* VOICE PANEL */
        .voice-panel {
            background: rgba(45, 27, 18, 0.8);
            padding: 20px;
            border-radius: 12px;
            margin: 20px;
            text-align: center;
        }

        .voice-panel.active {
            border: 2px solid var(--online);
        }

        .voice-users {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
            justify-content: center;
        }

        .voice-user {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .voice-user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border: 3px solid var(--online);
        }

        /* ADD FRIEND BUTTON */
        .add-friend-btn {
            width: 100%;
            padding: 12px;
            background: rgba(161, 136, 127, 0.2);
            border: 2px dashed var(--accent);
            border-radius: 8px;
            color: var(--cream);
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .add-friend-btn:hover {
            background: rgba(161, 136, 127, 0.3);
            border-style: solid;
        }

        /* NOTIFICATION */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--coffee-brown);
            padding: 16px 24px;
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--coffee-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--coffee-medium);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--coffee-brown);
            padding: 30px;
            border-radius: 16px;
            min-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: var(--cream);
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>☕ CoffeeChat</h1>
            <p>Уютное общение с друзьями</p>
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Введи своё имя..." maxlength="20">
            </div>
            <button class="btn-primary" onclick="login()">Войти</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <!-- SERVERS SIDEBAR -->
        <div class="servers-sidebar" id="serversList">
            <div class="server-icon active" data-server="default" onclick="switchServer('default')">
                ☕
            </div>
            <div class="server-icon" onclick="showCreateServerModal()">
                +
            </div>
        </div>

        <!-- CHANNELS SIDEBAR -->
        <div class="channels-sidebar">
            <div class="server-header" id="serverName">☕ Кофейня</div>
            <div class="channels-list" id="channelsList">
                <!-- Заполняется динамически -->
            </div>
            <div style="padding: 12px; border-top: 1px solid rgba(161, 136, 127, 0.1);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="member-avatar" id="userAvatar">
                        <div class="status-indicator status-online"></div>
                    </div>
                    <div>
                        <div id="currentUsername" style="font-weight: 600; font-size: 14px;"></div>
                        <div style="font-size: 12px; color: var(--accent);">онлайн</div>
                    </div>
                    <button class="icon-btn" onclick="showSettings()" style="margin-left: auto;">⚙️</button>
                </div>
            </div>
        </div>

        <!-- CHAT CONTAINER -->
        <div class="chat-container">
            <div class="chat-header">
                <span style="font-size: 20px;">#</span>
                <h2 id="currentChannelName">общий-чат</h2>
            </div>
            
            <div id="voicePanel" style="display: none;" class="voice-panel">
                <h3>🎤 Голосовой чат</h3>
                <div id="voiceUsers" class="voice-users"></div>
                <button class="btn-primary" onclick="leaveVoice()" style="margin-top: 16px; max-width: 200px;">Отключиться</button>
            </div>

            <div class="messages-area" id="messagesArea">
                <!-- Сообщения -->
            </div>

            <div class="message-input-area">
                <form class="message-input-wrapper" id="messageForm">
                    <input type="text" id="messageInput" placeholder="Напиши сообщение...">
                    <button type="submit" class="send-btn">Отправить</button>
                </form>
            </div>
        </div>

        <!-- MEMBERS/FRIENDS SIDEBAR -->
        <div class="members-sidebar">
            <div class="members-section">
                <div class="members-title">Друзья</div>
                <button class="add-friend-btn" onclick="showAddFriendModal()">+ Добавить друга</button>
                <div id="friendsList">
                    <!-- Друзья -->
                </div>
            </div>
            <div class="members-section">
                <div class="members-title">Участники сервера</div>
                <div id="membersList">
                    <!-- Участники -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="addFriendModal" class="modal">
        <div class="modal-content">
            <h3>Добавить в друзья</h3>
            <input type="text" id="friendUsernameInput" placeholder="Имя пользователя" class="input-group" style="width: 100%; padding: 12px; background: var(--coffee-dark); border: 1px solid var(--accent); border-radius: 8px; color: var(--cream); margin-bottom: 16px;">
            <div style="display: flex; gap: 12px;">
                <button class="btn-primary" onclick="addFriend()">Добавить</button>
                <button class="btn-primary" onclick="closeModal('addFriendModal')" style="background: var(--coffee-dark);">Отмена</button>
            </div>
        </div>
    </div>

    <div id="createServerModal" class="modal">
        <div class="modal-content">
            <h3>Создать сервер</h3>
            <input type="text" id="serverNameInput" placeholder="Название сервера" class="input-group" style="width: 100%; padding: 12px; background: var(--coffee-dark); border: 1px solid var(--accent); border-radius: 8px; color: var(--cream); margin-bottom: 16px;">
            <div style="display: flex; gap: 12px;">
                <button class="btn-primary" onclick="createServer()">Создать</button>
                <button class="btn-primary" onclick="closeModal('createServerModal')" style="background: var(--coffee-dark);">Отмена</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let currentServer = 'default';
        let currentChannel = 'general';
        let currentChannelType = 'text';
        let friends = [];
        let servers = [];
        let inVoiceChannel = null;
        let peerConnections = new Map();
        let localStream = null;

        // LOGIN
        function login() {
            const username = document.getElementById('usernameInput').value.trim();
            if (username) {
                socket.emit('register', username);
                document.getElementById('currentUsername').textContent = username;
                document.getElementById('userAvatar').textContent = username[0].toUpperCase();
                currentUser = { username: username };
            }
        }

        document.getElementById('usernameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });

        // SOCKET EVENTS
        socket.on('init', (data) => {
            currentUser = { ...currentUser, id: data.userId };
            servers = data.servers;
            friends = data.friends;
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('app').style.display = 'grid';
            
            renderServers();
            renderChannels();
            renderFriends();
        });

        socket.on('new-message', (data) => {
            if (data.channelId === currentChannel) {
                addMessage(data.message);
            }
        });

        socket.on('message-history', (data) => {
            document.getElementById('messagesArea').innerHTML = '';
            data.messages.forEach(msg => addMessage(msg));
        });

        socket.on('user-status', (data) => {
            updateUserStatus(data);
        });

        socket.on('friend-added', (friend) => {
            friends.push(friend);
            renderFriends();
        });

        socket.on('notification', (message) => {
            showNotification(message);
        });

        socket.on('server-created', (server) => {
            servers.push(server);
            renderServers();
        });

        socket.on('new-dm', (data) => {
            // Обработка личных сообщений
            if (currentChannel === 'dm-' + data.recipientId) {
                addMessage(data.message, true);
            }
        });

        socket.on('user-joined-voice', (data) => {
            if (data.channelId === inVoiceChannel) {
                renderVoiceUsers(data.users);
                
                // Создаем WebRTC соединение с новым пользователем
                if (data.userId !== currentUser.id) {
                    createPeerConnection(data.userId);
                }
            }
        });

        socket.on('user-left-voice', (data) => {
            if (data.channelId === inVoiceChannel) {
                if (peerConnections.has(data.userId)) {
                    peerConnections.get(data.userId).close();
                    peerConnections.delete(data.userId);
                }
            }
        });

        socket.on('voice-offer', async (data) => {
            const pc = createPeerConnection(data.from);
            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('voice-answer', { to: data.from, answer: answer });
        });

        socket.on('voice-answer', async (data) => {
            const pc = peerConnections.get(data.from);
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        socket.on('ice-candidate', async (data) => {
            const pc = peerConnections.get(data.from);
            if (pc) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        // SEND MESSAGE
        document.getElementById('messageForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message) {
                if (currentChannel.startsWith('dm-')) {
                    const recipientId = currentChannel.replace('dm-', '');
                    socket.emit('send-dm', { recipientId: recipientId, message: message });
                } else {
                    socket.emit('send-message', { channelId: currentChannel, message: message });
                }
                input.value = '';
            }
        });

        // ADD MESSAGE TO UI
        function addMessage(msg, isDM = false) {
            const messagesArea = document.getElementById('messagesArea');
            const messageEl = document.createElement('div');
            messageEl.className = 'message';
            
            const username = isDM ? msg.fromName : msg.username;
            const avatar = username[0].toUpperCase();
            
            messageEl.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-username">${username}</span>
                        <span class="message-time">${msg.time}</span>
                    </div>
                    <div class="message-text">${escapeHtml(msg.message)}</div>
                </div>
            `;
            
            messagesArea.appendChild(messageEl);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // RENDER FUNCTIONS
        function renderServers() {
            const serversList = document.getElementById('serversList');
            serversList.innerHTML = '';
            
            servers.forEach(server => {
                const icon = document.createElement('div');
                icon.className = 'server-icon';
                if (server.id === currentServer) icon.classList.add('active');
                icon.setAttribute('data-server', server.id);
                icon.textContent = server.name[0];
                icon.onclick = () => switchServer(server.id);
                serversList.appendChild(icon);
            });
            
            const addBtn = document.createElement('div');
            addBtn.className = 'server-icon';
            addBtn.textContent = '+';
            addBtn.onclick = showCreateServerModal;
            serversList.appendChild(addBtn);
        }

        function renderChannels() {
            const server = servers.find(s => s.id === currentServer);
            if (!server) return;
            
            document.getElementById('serverName').textContent = server.name;
            
            const channelsList = document.getElementById('channelsList');
            channelsList.innerHTML = '';
            
            // Текстовые каналы
            const textCategory = document.createElement('div');
            textCategory.className = 'channel-category';
            textCategory.innerHTML = '<div class="category-title">Текстовые каналы</div>';
            
            server.channels.filter(ch => ch.type === 'text').forEach(channel => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                if (channel.id === currentChannel) item.classList.add('active');
                item.innerHTML = `<span>#</span> ${channel.name}`;
                item.onclick = () => switchChannel(channel.id, 'text');
                textCategory.appendChild(item);
            });
            
            channelsList.appendChild(textCategory);
            
            // Голосовые каналы
            const voiceCategory = document.createElement('div');
            voiceCategory.className = 'channel-category';
            voiceCategory.innerHTML = '<div class="category-title">Голосовые каналы</div>';
            
            server.channels.filter(ch => ch.type === 'voice').forEach(channel => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.innerHTML = `<span>🔊</span> ${channel.name}`;
                item.onclick = () => joinVoiceChannel(channel.id);
                voiceCategory.appendChild(item);
            });
            
            channelsList.appendChild(voiceCategory);
        }

        function renderFriends() {
            const friendsList = document.getElementById('friendsList');
            friendsList.innerHTML = '';
            
            friends.forEach(friend => {
                const item = document.createElement('div');
                item.className = 'member-item';
                item.innerHTML = `
                    <div class="member-avatar">
                        ${friend.username[0].toUpperCase()}
                        <div class="status-indicator status-${friend.status}"></div>
                    </div>
                    <div class="member-name">${friend.username}</div>
                `;
                item.onclick = () => openDM(friend);
                friendsList.appendChild(item);
            });
        }

        // VOICE CHAT
        async function joinVoiceChannel(channelId) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                inVoiceChannel = channelId;
                
                document.getElementById('voicePanel').style.display = 'block';
                document.getElementById('messagesArea').style.display = 'none';
                document.getElementById('messageForm').parentElement.style.display = 'none';
                
                socket.emit('join-voice', channelId);
                
                showNotification('🎤 Подключено к голосовому чату');
            } catch (error) {
                showNotification('❌ Не удалось получить доступ к микрофону');
                console.error(error);
            }
        }

        function leaveVoice() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            peerConnections.forEach(pc => pc.close());
            peerConnections.clear();
            
            if (inVoiceChannel) {
                socket.emit('leave-voice', inVoiceChannel);
            }
            
            inVoiceChannel = null;
            document.getElementById('voicePanel').style.display = 'none';
            document.getElementById('messagesArea').style.display = 'flex';
            document.getElementById('messageForm').parentElement.style.display = 'block';
        }

        function createPeerConnection(userId) {
            const pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });
            
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });
            
            pc.ontrack = (event) => {
                const audio = new Audio();
                audio.srcObject = event.streams[0];
                audio.play();
            };
            
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', {
                        to: userId,
                        candidate: event.candidate
                    });
                }
            };
            
            peerConnections.set(userId, pc);
            
            // Создаем offer
            pc.createOffer().then(offer => {
                pc.setLocalDescription(offer);
                socket.emit('voice-offer', { to: userId, offer: offer });
            });
            
            return pc;
        }

        function renderVoiceUsers(users) {
            const voiceUsers = document.getElementById('voiceUsers');
            voiceUsers.innerHTML = '';
            
            users.forEach(user => {
                const userEl = document.createElement('div');
                userEl.className = 'voice-user';
                userEl.innerHTML = `
                    <div class="voice-user-avatar">${user.username[0].toUpperCase()}</div>
                    <div style="font-size: 12px;">${user.username}</div>
                `;
                voiceUsers.appendChild(userEl);
            });
        }

        // SWITCH FUNCTIONS
        function switchServer(serverId) {
            currentServer = serverId;
            const server = servers.find(s => s.id === serverId);
            if (server && server.channels.length > 0) {
                const firstTextChannel = server.channels.find(ch => ch.type === 'text');
                if (firstTextChannel) {
                    switchChannel(firstTextChannel.id, 'text');
                }
            }
            renderServers();
            renderChannels();
        }

        function switchChannel(channelId, type) {
            currentChannel = channelId;
            currentChannelType = type;
            
            const server = servers.find(s => s.id === currentServer);
            const channel = server.channels.find(ch => ch.id === channelId);
            
            document.getElementById('currentChannelName').textContent = channel.name;
            document.getElementById('messagesArea').innerHTML = '';
            
            socket.emit('get-channel-messages', channelId);
            renderChannels();
        }

        function openDM(friend) {
            currentChannel = 'dm-' + friend.id;
            document.getElementById('currentChannelName').textContent = '@ ' + friend.username;
            document.getElementById('messagesArea').innerHTML = '';
            socket.emit('get-dm-history', friend.id);
        }

        // MODALS
        function showAddFriendModal() {
            document.getElementById('addFriendModal').classList.add('active');
        }

        function showCreateServerModal() {
            document.getElementById('createServerModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function addFriend() {
            const username = document.getElementById('friendUsernameInput').value.trim();
            if (username) {
                socket.emit('add-friend', username);
                document.getElementById('friendUsernameInput').value = '';
                closeModal('addFriendModal');
            }
        }

        function createServer() {
            const name = document.getElementById('serverNameInput').value.trim();
            if (name) {
                socket.emit('create-server', name);
                document.getElementById('serverNameInput').value = '';
                closeModal('createServerModal');
            }
        }

        // UTILS
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateUserStatus(data) {
            // Обновление статусов в UI
            renderFriends();
        }

        function showSettings() {
            showNotification('⚙️ Настройки (в разработке)');
        }
    </script>
</body>
</html>
